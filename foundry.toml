[profile.default]
src = "hooks"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# 编译器版本与 EVM 规范
# Uniswap v4 依赖瞬态存储操作码 (Transient Storage: TSTORE/TLOAD)，必须指定 cancun
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# 测试与外部脚本权限
ffi = true
fs_permissions = [{ access = "read", path = "./" }]

# 模糊测试 (Fuzz Testing) 并发配置
[fuzz]
runs = 256
max_test_rejects = 65536

# 库路径重映射 (Remappings)
remappings = [
    "v4-core/=lib/v4-core/src/",
    "v4-periphery/=lib/v4-periphery/src/",
    "forge-std/=lib/forge-std/src/"
]

# Arc Public Testnet RPC 终端绑定
[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

# ArcScan 验证配置
[etherscan]
arc_testnet = { key = "${ARC_SCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
